[package]
name = "walloftext-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "walloftext"
path = "src/main.rs"

[[bin]]
name = "migrate-snapshot"
path = "src/bin/migrate_snapshot.rs"

[dependencies]
walloftext-shared.workspace  = true
bitcode.workspace            = true
anyhow.workspace             = true
zstd.workspace               = true
axum              = { version = "0.8", features = ["ws"] }
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
tower-http        = { version = "0.7", features = ["fs"] }
futures-util      = "0.3"
tracing           = "0.1"
tracing-subscriber = "0.3"
thiserror         = "2"
rand              = "0.10"
image             = { version = "0.25", default-features = false, features = ["png"] }
