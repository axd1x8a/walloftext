[package]
name = "walloftext-frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
walloftext-shared.workspace = true
bitcode.workspace = true
anyhow.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
ruzstd = "0.9"
console_error_panic_hook = "0.1"
wgpu = { version = "30.0", features = ["web", "webgpu", "webgl"] }
bytemuck = { version = "1", features = ["derive"] }
bitflagset = "0.0.3"
foldhash = "0.2"

[dependencies.web-sys]
version = "0.3.105"
features = [
  "AddEventListenerOptions",
  "BinaryType",
  "CanvasRenderingContext2d",
  "CharacterData",
  "Clipboard",
  "CloseEvent",
  "console",
  "ContextAttributes2d",
  "CssStyleDeclaration",
  "DedicatedWorkerGlobalScope",
  "Document",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "Element",
  "ErrorEvent",
  "Event",
  "EventTarget",
  "History",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "Request",
  "Response",
  "Storage",
  "Text",
  "TextMetrics",
  "Touch",
  "TouchEvent",
  "TouchList",
  "WebSocket",
  "WheelEvent",
  "Window",
  "Worker",
]

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[profile.release]
opt-level = "s"
lto = true
debug = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true
